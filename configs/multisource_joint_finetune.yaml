seed: 2026
device: auto

data:
  dataset_root: Dataset
  train_manifest: training_multisource.csv
  # Fixed model-selection split. The disjoint 10k confirmation split is used
  # only after a candidate has passed all pre-declared gates here.
  val_manifest: validation_selection_6000.csv
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  balanced_sampling: true
  # 20% means no extra RandomDegradation; ordinary crop/flip/jitter still run.
  train_degradation_probability: 0.80
  train_degradation_kind_weights:
    jpeg: 1.0
    blur: 4.0
    scale: 1.0
    noise: 2.0
    color: 0.5
    crop: 0.5
  train_blur_weights: [1.0, 2.0, 3.0]
  # The internal compression-history audit found a real/fake codec association.
  # This label-blind branch is deliberately moderate and retains 65% without
  # extra re-encoding; static all-JPEG conversion is explicitly avoided.
  train_reencode_probability: 0.35
  train_reencode_codecs: [jpeg, webp]
  train_reencode_qualities: [50, 65, 80, 95]
  max_train_samples: null
  max_val_samples: null

model:
  name: convnext_tiny
  pretrained: false
  dropout: 0.10
  drop_path: 0.10

training:
  epochs: 2
  learning_rate: 0.00003
  weight_decay: 0.05
  warmup_epochs: 0
  accumulation_steps: 1
  gradient_clip: 1.0
  evaluate_init_checkpoint: true
  max_batches_per_epoch: null
  max_val_batches: null

validation:
  conditions:
    - clean
    - jpeg_90
    - jpeg_70
    - jpeg_50
    - jpeg_30
    - blur_0.5
    - blur_1.0
    - blur_2.0
    - scale_0.5
    - scale_0.25
    - noise_0.02
    - noise_0.05
    - noise_0.10
    - color_-0.20
    - color_0.20
    - crop_0.80

output:
  directory: outputs/multisource_joint_finetune_v1
  tensorboard: true
  save_epoch_checkpoints: true

seed: 2026
device: auto

data:
  dataset_root: Dataset
  train_manifest: training_smoke.csv
  val_manifest: validation_smoke.csv
  image_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  balanced_sampling: true
  train_degradation_probability: 0.50
  max_train_samples: null
  max_val_samples: null

model:
  name: convnext_tiny
  pretrained: true
  dropout: 0.10
  drop_path: 0.10

training:
  epochs: 2
  learning_rate: 0.0002
  weight_decay: 0.05
  warmup_epochs: 0
  accumulation_steps: 1
  gradient_clip: 1.0
  max_batches_per_epoch: null
  max_val_batches: null

validation:
  conditions: [clean, jpeg_50, blur_1.0, scale_0.5]

output:
  directory: outputs/baseline_smoke
  tensorboard: true

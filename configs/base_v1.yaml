# ConvNeXt-Base controlled comparison against the frozen Tiny vNext release.
seed: 2026
device: auto

data:
  dataset_root: Dataset
  train_manifest: tiny_vnext_train_balanced_280000.csv
  val_manifest: validation_modern_combined_selection_12000.csv
  image_size: 224
  batch_size: 16
  num_workers: 4
  pin_memory: true
  balanced_sampling: false
  train_degradation_probability: 0.80
  train_degradation_kind_weights:
    jpeg: 12.0
    blur: 24.0
    scale: 10.0
    noise: 18.0
    color: 8.0
    crop: 8.0
  train_blur_weights: [4.0, 6.0, 14.0]
  train_reencode_probability: 0.15
  max_train_samples: null
  max_val_samples: null

model:
  name: convnext_base.fb_in22k_ft_in1k
  pretrained: true
  dropout: 0.10
  drop_path: 0.10

warmstart:
  # Base cannot load Tiny weights. Null means start from the declared timm
  # ImageNet-22K -> ImageNet-1K pretrained backbone.
  checkpoint: null

distillation:
  # Frozen, already accepted Tiny vNext teacher. KD is limited to historical
  # sources so it cannot cap learning on the new modern-generator sources.
  teacher_checkpoint: outputs/tiny_vnext/final_candidate/tiny_vnext_seed2026_gain1p60.pt
  temperature: 2.0
  kd_weight: 0.5
  kd_sources:
    - GenImage
    - SID_Set
  frozen_prefixes:
    - stem.
    - stages.0.
    - stages.1.
  head_learning_rate: 0.0002
  stages_learning_rate: 0.00001

training:
  epochs: 2
  weight_decay: 0.05
  warmup_epochs: 1
  accumulation_steps: 2
  gradient_clip: 1.0
  max_batches_per_epoch: null
  max_val_batches: null

early_stop:
  enabled: true
  reference_metrics: outputs/tiny_vnext/historical_gain_sweep/candidate_gain_1p60.json
  sources:
    - GenImage
    - SID_Set
  max_source_drop: 0.005

validation:
  conditions:
    - clean
    - jpeg_90
    - jpeg_70
    - jpeg_50
    - jpeg_30
    - blur_0.5
    - blur_1.0
    - blur_2.0
    - scale_0.5
    - scale_0.25
    - noise_0.02
    - noise_0.05
    - noise_0.10
    - color_-0.20
    - color_0.20
    - crop_0.80

output:
  directory: outputs/base_v1/primary
  tensorboard: true
  save_epoch_checkpoints: true

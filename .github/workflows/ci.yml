name: CI

on:
  push:
    branches: [main, ensemble-vnext]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source without large LFS assets
        uses: actions/checkout@v7
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python test.py

      - name: Compile Python sources
        run: >-
          python -m compileall -q src scripts train.py train_adapter.py
          train_base_v3.py train_repair_adapter.py train_replay_distill.py
          evaluate.py predict.py test.py

      - name: Check installed dependencies
        run: python -m pip check
